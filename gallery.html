<!DOCTYPE html>

<head>

    <img src="images/travel/t1.jpg" alt="">
    <img src="images/travel/t2.jpg" alt="">
    <img src="images/travel/t3.jpg" alt="">

  <div id="wildlife" class="carousel">
    <img src="images/wildlife/w1.jpg" alt="">
    <img src="images/wildlife/w2.jpg" alt="">
